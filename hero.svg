<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Nizamuddin A - Aspiring Software Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A1A"/>
      <stop offset="1" stop-color="#150B2E"/>
    </linearGradient>
    <radialGradient id="body" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  
  <!-- Orb: moves to translate(190,150); beat = lub-dub every 2s -->
  <g transform="translate(450 130) scale(0.85)">
    <g>
      <animateTransform attributeName="transform" type="scale" dur="2s" repeatCount="indefinite"
        values="1;1.08;1;1.05;1;1" keyTimes="0;0.1;0.22;0.34;0.5;1"
        calcMode="spline" keySplines="0.3 0 0.2 1;0.4 0 0.6 1;0.3 0 0.2 1;0.4 0 0.6 1;0.5 0 0.5 1"/>

      <circle r="135" fill="url(#halo)"/>
      <circle r="100" fill="url(#body)"/>
      <circle r="100" fill="none" stroke="#8B5CF6" stroke-width="6" opacity="0.6" filter="url(#soft)"/>
      <circle r="100" fill="none" stroke="url(#rim)" stroke-width="2"/>

      <!-- Meridians: width shrinks and grows so the orb looks like it spins -->
      <g fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7">
        <ellipse ry="100" rx="100" stroke="#22D3EE">
          <animate attributeName="rx" dur="6s" repeatCount="indefinite" begin="0s"
            values="100;0;100" calcMode="spline" keySplines="0.4 0 0.8 0.6;0.2 0.4 0.6 1"/>
        </ellipse>
        <ellipse ry="100" rx="100" stroke="#8B5CF6">
          <animate attributeName="rx" dur="6s" repeatCount="indefinite" begin="-2s"
            values="100;0;100" calcMode="spline" keySplines="0.4 0 0.8 0.6;0.2 0.4 0.6 1"/>
        </ellipse>
        <ellipse ry="100" rx="100" stroke="#EC4899">
          <animate attributeName="rx" dur="6s" repeatCount="indefinite" begin="-4s"
            values="100;0;100" calcMode="spline" keySplines="0.4 0 0.8 0.6;0.2 0.4 0.6 1"/>
        </ellipse>
      </g>

      <!-- Latitude rings with dots circling -->
      <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 8">
        <ellipse cy="-58" rx="81" ry="20" stroke="#EC4899">
          <animate attributeName="stroke-dashoffset" from="0" to="-81" dur="6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="0" rx="100" ry="26" stroke="#22D3EE">
          <animate attributeName="stroke-dashoffset" from="0" to="-81" dur="6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="58" rx="81" ry="20" stroke="#8B5CF6">
          <animate attributeName="stroke-dashoffset" from="0" to="-81" dur="6s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- Glowing nodes on tilted orbits -->
      <g transform="rotate(-25)">
        <circle r="4.5" fill="#22D3EE">
          <animateMotion dur="5s" repeatCount="indefinite" path="M-122,0 A122,36 0 1,1 122,0 A122,36 0 1,1 -122,0"/>
        </circle>
      </g>
      <g transform="rotate(30)">
        <circle r="4.5" fill="#EC4899">
          <animateMotion dur="7s" repeatCount="indefinite" path="M-122,0 A122,36 0 1,1 122,0 A122,36 0 1,1 -122,0"/>
        </circle>
      </g>
      <circle cx="-30" cy="-34" r="3" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

<metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Name on top of the orb -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" stroke-linejoin="round" style="paint-order:stroke">
    <text x="450" y="148" font-size="58" font-weight="700" fill="#FFFFFF" stroke="#0A0A1A" stroke-width="7">Nizamuddin A</text>
    <text x="450" y="188" font-size="17" font-weight="700" letter-spacing="2" fill="#FFFFFF" stroke="#0A0A1A" stroke-width="5">ASPIRING SOFTWARE ENGINEER | C++ | PYTHON</text>
  </g>
</svg>
